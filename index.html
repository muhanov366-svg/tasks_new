<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер задач</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Трекер задач</h1>
        </header>

        <!-- Форма добавления задачи -->
        <div class="add-task">
            <input type="text" id="taskInput" placeholder="Введите описание задачи...">
            <button id="addTaskBtn">Добавить задачу</button>
        </div>

        <!-- Фильтры -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="active">Активные</button>
            <button class="filter-btn" data-filter="completed">Выполненные</button>
        </div>

        <!-- Список задач -->
        <div id="tasksList" class="tasks-list">
            <!-- Задачи будут добавляться динамически -->
        </div>

        <!-- Статистика -->
        <div class="stats">
            Всего задач: <span id="totalCount">0</span> |
            Выполнено: <span id="completedCount">0</span> |
            Осталось: <span id="remainingCount">0</span>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
