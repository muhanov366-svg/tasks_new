<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Трекер задач - Мобильная версия</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        /* Auth Modal */
        .modal {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background: white;
            padding: 24px 20px;
            border-radius: 20px;
            max-width: 100%;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 24px;
        }

        /* Header */
        .header {
            background: white;
            border-radius: 15px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .user-info {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
        }

        .role-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            background: #667eea;
            color: white;
            display: inline-block;
        }

        button {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            -webkit-appearance: none;
        }

        button:active {
            transform: scale(0.98);
        }

        button.danger {
            background: #e53e3e;
        }

        button.success {
            background: #48bb78;
        }

        button.warning {
            background: #ed8936;
        }

        button.secondary {
            background: #718096;
        }

        input, textarea, select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            width: 100%;
            -webkit-appearance: none;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Main layout - мобильная версия */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Task sections */
        .task-section {
            background: white;
            border-radius: 15px;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .task-section h2 {
            font-size: 18px;
            margin-bottom: 16px;
        }

        .task-list {
            max-height: 60vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .task-card {
            background: #f7f9fc;
            border-left: 4px solid #667eea;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 10px;
            transition: all 0.2s;
        }

        .task-card:active {
            transform: scale(0.99);
        }

        .task-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 6px;
            word-break: break-word;
        }

        .task-description {
            color: #666;
            font-size: 13px;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .task-meta {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 11px;
            color: #888;
            margin-bottom: 10px;
        }

        .task-meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .task-due {
            color: #e53e3e;
            font-weight: bold;
        }

        .task-status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }

        .status-in-progress {
            background: #fef5e7;
            color: #f39c12;
        }

        .status-done {
            background: #e8f8f5;
            color: #27ae60;
        }

        .task-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .task-actions button {
            padding: 8px 12px;
            font-size: 12px;
            width: auto;
            flex: 1;
            min-width: 70px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .sprint-section {
            background: white;
            border-radius: 15px;
            padding: 16px;
            margin-top:
            0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .sprint-section h2 {
            font-size: 18px;
            margin-bottom: 12px;
        }

        .sprint-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .sprint-controls input {
            flex: 1;
            min-width: 150px;
        }

        .sprint-controls button {
            width: auto;
            padding: 12px 20px;
        }

        .sprint-tasks {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .sprint-task {
            background: #e8f8f5;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            min-width: 120px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sprint-task:active {
            transform: scale(0.98);
        }

        /* Team management */
        .team-section {
            background: white;
            border-radius: 15px;
            padding: 16px;
            margin-top: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .team-section h2 {
            font-size: 18px;
            margin-bottom: 12px;
        }

        .members-list {
            margin-top: 12px;
            max-height: 50vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .member-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            background: #f7f9fc;
            border-radius: 10px;
            border-left: 3px solid #667eea;
        }

        .member-info {
            flex: 1;
        }

        .member-info strong {
            font-size: 14px;
        }

        .member-role {
            font-size: 11px;
            color: #888;
            margin-top: 3px;
        }

        .member-item button {
            width: auto;
            padding: 6px 12px;
            font-size: 12px;
        }

        .add-member-form {
            margin-top: 16px;
            padding: 16px;
            background: #f7f9fc;
            border-radius: 12px;
        }

        .add-member-form h3 {
            font-size: 16px;
            margin-bottom: 12px;
        }

        .hidden {
            display: none;
        }

        .team-info {
            font-size: 12px;
            color: #888;
            word-break: break-all;
        }

        .user-details {
            font-size: 12px;
            font-weight: normal;
            word-break: break-word;
        }

        /* Адаптация для очень маленьких экранов */
        @media (max-width: 480px) {
            body {
                padding: 8px;
            }
            
            .header h1 {
                font-size: 18px;
            }
            
            .task-actions button {
                font-size: 11px;
                padding: 6px 10px;
            }
            
            .sprint-controls {
                flex-direction: column;
            }
            
            .sprint-controls button {
                width: 100%;
            }
            
            .member-item {
                flex-direction: column;
                gap: 8px;
            }
            
            .member-item button {
                width: 100%;
            }
        }

        /* Улучшенная прокрутка */
        .task-list::-webkit-scrollbar,
        .members-list::-webkit-scrollbar {
            width: 4px;
        }
        
        .task-list::-webkit-scrollbar-track,
        .members-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        .task-list::-webkit-scrollbar-thumb,
        .members-list::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }

        .team-card {
            background: white;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .modal.hidden {
            display: none;
        }

        .assignee-group {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            background: #f9f9f9;
        }

        .tasks-for-assignee {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Модальное окно авторизации/создания команды -->
        <div id="authModal" class="modal">
            <div class="modal-content">
                <h2>🏢 Создание команды</h2>
                <div class="form-group">
                    <label>Ваш никнейм *</label>
                    <input type="text" id="userNickname" placeholder="Введите ваш никнейм">
                </div>
                <div class="form-group">
                    <label>Ваш телефон *</label>
                    <input type="tel" id="userPhone" placeholder="+7 (XXX) XXX-XX-XX">
                </div>
                <div class="form-group">
                    <label>Роль в команде *</label>
                    <select id="userRole">
                        <option value="manager">👔 Руководитель</option>
                        <option value="executor">👤 Исполнитель</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Название команды *</label>
                    <input type="text" id="teamName" placeholder="Название вашей команды">
                </div>
                <button onclick="createTeam()" style="width: 100%;">🚀 Создать команду</button>
                
                <div style="margin-top: 20px; text-align: center;">
                    <hr style="margin: 20px 0;">
                    <p style="color: #888;">Уже есть команда?</p>
                    <button onclick="showJoinTeam()" class="success" style="margin-top: 10px;">🔗 Войти в команду</button>
                </div>
            </div>
        </div>

        <!-- Основной интерфейс -->
        <div id="mainApp" class="hidden">
            <div class="container">
                <div class="header">
                    <div>
                <h1>📋 Трекер задач</h1>
                <div class="team-info" id="teamInfo"></div>
            </div>
            <div class="user-info">
                <span class="role-badge" id="roleBadge"></span>
                <div class="user-details" id="userInfo"></div>
                <button onclick="logout()" class="danger" style="width: auto; padding: 8px 16px;">🚪</button>
</div>
</div>

<div class=“main-content”>
<div class=“task-section”>
<h2>➕ Создать задачу</h2>
<form id=“taskForm”>
<div class=“form-group”>
<label>Название задачи *</label>
<input type=“text” id=“taskTitle” required>
</div>
<div class=“form-group”>
<label>Описание</label>
<textarea id=“taskDesc” rows=“3”></textarea>
</div>
<div class=“form-group”>
<label>Срок выполнения</label>
<input type=“date” id=“taskDue”>
</div>
<div class=“form-group”>
<label>Исполнитель</label>
<select id=“taskAssignee”>
<!-- Опции будут добавляться динамически -->
</select>
</div>
<div class=“form-group”>
<label>Приоритет</label>
<select id=“taskPriority”>
<option value=“low”>Низкий</option>
<option value=“medium” selected>Средний</option>
<option value=“high”>Высокий</option>
</select>
</div>
<button type=“submit” class=“success”>✅ Создать задачу</button>
</form>
</div>

<div class=“task-section”>
<h2>📋 Активные задачи</h2>
<div class=“task-list” id=“activeTasksList”>
<!-- Список задач будет добавляться динамически -->
<p class=“empty-state”>Нет активных задач</p>
</div>
</div>

<div class=“sprint-section”>
<h2>🏃 Спринты</h2>
<div class=“sprint-controls”>
<input type=“text” placeholder=“Название спринта” id=“sprintName”>
<input type=“date” id=“sprintStart”>
<input type=“date” id=“sprintEnd”>
<button onclick=“createSprint()” class=“primary”>➕ Создать спринт</button>
</div>
<div class=“sprint-tasks” id=“sprintsContainer”>
<!-- Спринты будут добавляться динамически -->
</div>
</div>

<div class=“team-section”>
<h2>👨‍👩‍👦 Управление командой</h2>
<div class=“members-list” id=“membersList”>
<!-- Члены команды будут добавляться динамически -->
</div>
<div class=“add-member-form”>
<h3>➕ Добавить участника</h3>
<div class=“form-group”>
<label>Имя участника</label>
<input type=“text” id=“memberName” placeholder=“Введите имя”>
</div>
<div class=“form-group”>
<label>Роль</label>
<select id=“memberRole”>
<option value=“manager”>Руководитель</option>
<option value=“executor” selected>Исполнитель</option>
</select>
</div>
<button onclick=“addMember()” class=“success”>➕ Добавить</button>
</div>
</div>
</div>
</div>

<script>
// Базовые функции приложения
function createTeam() {
const nickname = document.getElementById(‘userNickname’).value;
const phone = document.getElementById(‘userPhone’).value;
const role = document.getElementById(‘userRole’).value;
const teamName = document.getElementById(‘teamName’).value;

if (!nickname || !phone || !teamName) {
alert(‘Заполните все обязательные поля’);
return;
}

// Здесь будет логика создания команды
document.getElementById(‘authModal’).classList.add(‘hidden’);
document.getElementById(‘mainApp’).classList.remove(‘hidden’);

// Обновление интерфейса
document.getElementById(‘teamInfo’).textContent = Команда: ${teamName};
document.getElementById(‘userInfo’).textContent = Никнейм: ${nickname}, Телефон: ${phone};

const roleText = role === ‘manager’ ? ‘Руководитель’ : ‘Исполнитель’;
document.getElementById(‘roleBadge’).textContent = roleText;
}

function showJoinTeam() {
alert(‘Функция входа в команду будет реализована позже’);
}

function logout() {
document.getElementById(‘mainApp’).classList.add(‘hidden’);
document.getElementById(‘authModal’).classList.remove(‘hidden’);
}

function createSprint() {
const sprintName = document.getElementById(‘sprintName’).value;
const startDate = document.getElementById(‘sprintStart’).value;
const endDate = document.getElementById(‘sprintEnd’).value;

if (!sprintName || !startDate || !endDate) {
alert(‘Заполните все поля спринта’);
return;
}

// Логика создания спринта
alert(Спринт "${sprintName}" создан!);
}

function addMember() {
const memberName = document.getElementById(‘memberName’).value;
const memberRole = document.getElementById(‘memberRole’).value;

if (!memberName) {
alert(‘Введите имя участника’);
return;
}

// Логика добавления участника
alert(Участник "${memberName}" добавлен в команду!);
}

// Инициализация при загрузке
document.addEventListener(‘DOMContentLoaded’, function() {
// Показываем модальное окно авторизации при загрузке
document.getElementById(‘authModal’).classList.remove(‘hidden’);
});
</script>
</body>
</html>
